name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name MoonAligner
          main.py

      - name: Create distribution archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\MoonAligner.exe package\MoonAligner.exe
          Copy-Item README.md package\README.md
          Copy-Item VERSION.txt package\VERSION.txt
          Compress-Archive -Path package\* -DestinationPath MoonAligner-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonAligner-Windows-x64
          path: MoonAligner-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          MoonAligner-Windows-x64.zip
          --verify-tag
          --generate-notes
          --title "Moon Aligner ${{ github.ref_name }}"
